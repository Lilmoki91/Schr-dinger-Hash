<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Identity Gate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #050914; color: #00ffcc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #0b1120; border: 1px solid #00ffcc; padding: 30px; max-width: 550px; width: 100%; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        h1 { font-size: 20px; margin-bottom: 20px; text-transform: uppercase; }
        .btn { display: block; width: 100%; padding: 12px; background: #00ffcc; color: #050914; font-weight: bold; margin-bottom: 15px; cursor: pointer; border: none; text-decoration: none; border-radius: 5px; }
        .console { background: #000; color: #0f0; padding: 15px; font-size: 12px; text-align: left; height: 250px; overflow-y: auto; border: 1px solid #333; margin-top: 15px; font-family: monospace; }
        .error { color: #ff3333; margin-top: 10px; font-weight: bold; }
        .success { color: #00ffcc; }
        .hidden { display: none; }
        .telegram-login { min-height: 50px; margin: 20px 0; display: flex; justify-content: center; }
        .warning { color: #ffaa00; margin-top: 10px; }
        .data-panel { background: #0a0a0a; border: 1px solid #00ffcc33; border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: left; font-size: 11px; }
        .data-panel div { margin: 5px 0; word-break: break-all; }
        .label { color: #888; }
        .value { color: #00ffcc; font-weight: bold; }
        .highlight { color: #00ffcc; background: #00ffcc20; border-radius: 4px; padding: 2px 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚛️ Quantum Identity Gate</h1>
    
    <div id="init-section">
        <a href="https://t.me/kipidapps_bot" target="_blank" class="btn">🔐 Jana State Vector (Telegram)</a>
        <p class="warning" style="font-size: 11px; margin-top: 5px;">⚠️ Token tamat selepas 30s – 10 minit (Fibonacci TTL)</p>
    </div>
    
    <div id="data-section" class="hidden">
        <div class="data-panel">
            <div><span class="label">🌀 Quantum Matrix ID:</span> <span id="displayQuantumMatrixId" class="value highlight">-</span></div>
            <div><span class="label">👤 User ID:</span> <span id="displayUserId" class="value">-</span></div>
            <div><span class="label">🔢 Akses ke-:</span> <span id="displayAccessCount" class="value">-</span></div>
            <div><span class="label">⏱️ Token sah:</span> <span id="displayTokenTTL" class="value">-</span></div>
            <div><span class="label">🌱 Seed:</span> <span id="displaySeed" class="value">-</span></div>
            <div><span class="label">💻 State 8-Qubit:</span> <span id="displayQubits" class="value">-</span></div>
            <div><span class="label">🔑 Hash Kuantum:</span> <span id="displayHash" class="value">-</span></div>
        </div>
    </div>
    
    <div id="login-section" class="hidden">
        <p>🔐 SAHKAN IDENTITI PEMERHATI</p>
        <div id="telegram-login" class="telegram-login"></div>
        <p id="error-msg" class="error hidden"></p>
        <button id="backToInitBtn" class="btn" style="background: #333; color: #00ffcc; margin-top: 10px;">⬅ Kembali / Jana Token Baru</button>
    </div>
    
    <div id="verify-section" class="hidden">
        <p id="status-text">🌀 Menyelaras fungsi gelombang...</p>
        <div class="console" id="console-log"></div>
    </div>
</div>

<script>
    const BOT_USERNAME = "kipidapps_bot";
    
    let state = { 
        token: null, userIdFromToken: null, seedHex: null, remoteHash: null, tokenId: null,
        accessCount: null, ttlSeconds: null, qStateVisual: null, quantumMatrixId: null
    };
    
    function log(msg, cls = '') {
        const box = document.getElementById('console-log');
        if(!box) return;
        const line = document.createElement('div');
        line.className = cls;
        line.innerText = '> ' + msg;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }
    
    function formatTTL(seconds) {
        if (!seconds) return "N/A";
        if (seconds < 60) return `${seconds} saat`;
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins} minit ${secs} saat`;
    }
    
    function resetToInit() {
        state = { 
            token: null, userIdFromToken: null, seedHex: null, remoteHash: null, tokenId: null,
            accessCount: null, ttlSeconds: null, qStateVisual: null, quantumMatrixId: null
        };
        document.getElementById('init-section').classList.remove('hidden');
        document.getElementById('data-section').classList.add('hidden');
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('verify-section').classList.add('hidden');
        const widgetContainer = document.getElementById('telegram-login');
        widgetContainer.innerHTML = '';
        const errorMsg = document.getElementById('error-msg');
        errorMsg.classList.add('hidden');
        errorMsg.innerText = '';
        console.log("Kembali ke mod permulaan.");
    }
    
    function displayTokenData(data) {
        if (data.qid) {
            document.getElementById('displayQuantumMatrixId').innerText = data.qid;
            state.quantumMatrixId = data.qid;
        }
        document.getElementById('displayUserId').innerText = data.u || "-";
        document.getElementById('displayAccessCount').innerText = data.cnt || "-";
        document.getElementById('displayTokenTTL').innerText = formatTTL(data.ttl);
        document.getElementById('displaySeed').innerText = data.s ? data.s.substring(0, 16) + "..." : "-";
        
        if (data.h) {
            const qState = data.h.substring(0, 8).split('').map(c => 
                (parseInt(c, 16) % 2 === 0) ? '|0⟩' : '|1⟩'
            ).join(' ');
            document.getElementById('displayQubits').innerText = qState;
            document.getElementById('displayHash').innerText = data.h.substring(0, 16) + "...";
            state.qStateVisual = qState;
        }
        state.accessCount = data.cnt;
        state.ttlSeconds = data.ttl;
    }
    
    async function calculateQuantumHash(userIdStr, seedHex) {
        let bits = new Array(8).fill(0);
        for(let i=0; i<6; i++) bits[i] = parseInt(seedHex.substr(i*2, 2), 16) % 2;
        let uid = BigInt(userIdStr);
        bits[6] = Number(uid % 256n) > 128 ? 1 : 0;
        bits[7] = Number((uid >> 8n) % 256n) > 128 ? 1 : 0;
        for(let i=0; i<6; i++) if(bits[6] === 1) bits[i] ^= 1;
        let finalIndex = (bits[0]<<7) | (bits[1]<<6) | (bits[2]<<5) | (bits[3]<<4) | (bits[4]<<3) | (bits[5]<<2) | (bits[6]<<1) | bits[7];
        let stateList = new Array(256).fill(0);
        stateList[finalIndex] = 1;
        let stateStr = JSON.stringify(stateList);
        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(stateStr));
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    window.onTelegramAuth = async function(telegramUser) {
        const loggedInUserId = telegramUser.id.toString();
        const errorMsg = document.getElementById('error-msg');
        
        if (!state.userIdFromToken) {
            errorMsg.innerText = "❌ Tiada token. Sila jana token baru dari bot.";
            errorMsg.classList.remove('hidden');
            return;
        }
        
        if (loggedInUserId !== state.userIdFromToken) {
            errorMsg.innerText = `[403 FORBIDDEN] Identiti tidak sepadan! ID Anda: ${loggedInUserId}`;
            errorMsg.classList.remove('hidden');
            return;
        }
        
        errorMsg.classList.add('hidden');
        document.getElementById('data-section').classList.add('hidden');
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('verify-section').classList.remove('hidden');
        document.getElementById('console-log').style.display = 'block';
        
        log(`✅ Identiti disahkan: ${loggedInUserId}`);
        if (state.quantumMatrixId) log(`🌀 Quantum Matrix ID: ${state.quantumMatrixId}`);
        if (state.accessCount) log(`📊 Akses ke-: ${state.accessCount}`);
        if (state.ttlSeconds) log(`⏱️ Token sah: ${formatTTL(state.ttlSeconds)}`);
        if (state.qStateVisual) log(`💻 State 8-Qubit: ${state.qStateVisual}`);
        log(`🔑 Hash Kuantum: ${state.remoteHash.substring(0,16)}...`);
        log("🌀 Membina litar kuantum...");
        
        const localHash = await calculateQuantumHash(state.userIdFromToken, state.seedHex);
        log(`🤖 Bot Hash: ${state.remoteHash.substring(0,16)}...`);
        log(`💻 Local Hash: ${localHash.substring(0,16)}...`);
        
        if (localHash === state.remoteHash) {
            log("✅ PADANAN BERJAYA", "success");
            document.getElementById('status-text').innerText = "✨ Portal Berdaulat Dibuka ✨";
            document.getElementById('status-text').className = "success";
            
            // ✅ TANDA USED HANYA DI SINI – SELEPAS PADANAN BERJAYA
            if (state.tokenId) {
                const usedKey = `used_quantum_token_${state.tokenId}`;
                sessionStorage.setItem(usedKey, 'true');
            }
            
            setTimeout(() => {
                window.location.href = `kucing-kuantum.html?token=${encodeURIComponent(state.token)}`;
            }, 2000);
        } else {
            log("❌ RALAT: HASH TIDAK PADAN", "error");
            document.getElementById('status-text').innerText = "⛔ Akses Ditolak.";
            document.getElementById('status-text').className = "error";
        }
    };
    
    window.onload = () => {
        const token = new URLSearchParams(window.location.search).get('token');
        const backBtn = document.getElementById('backToInitBtn');
        if (backBtn) backBtn.addEventListener('click', resetToInit);
        
        if (token) {
            try {
                const data = JSON.parse(atob(token));
                const currentTime = Math.floor(Date.now() / 1000);
                if (data.exp && currentTime > data.exp) {
                    document.getElementById('init-section').classList.remove('hidden');
                    const warningMsg = document.createElement('p');
                    warningMsg.className = 'warning';
                    warningMsg.innerText = '⚠️ Token telah tamat tempoh. Sila jana token baru dari bot.';
                    document.getElementById('init-section').appendChild(warningMsg);
                    setTimeout(() => warningMsg.remove(), 5000);
                    return;
                }
                
                state.token = token;
                state.userIdFromToken = data.u;
                state.seedHex = data.s;
                state.remoteHash = data.h;
                state.tokenId = data.tid || null;
                state.quantumMatrixId = data.qid || null;
                if (data.cnt) state.accessCount = data.cnt;
                if (data.ttl) state.ttlSeconds = data.ttl;
                
                displayTokenData(data);
                
                document.getElementById('init-section').classList.add('hidden');
                document.getElementById('data-section').classList.remove('hidden');
                document.getElementById('login-section').classList.remove('hidden');
                
                const widgetContainer = document.getElementById('telegram-login');
                widgetContainer.innerHTML = '';
                const script = document.createElement('script');
                script.async = true;
                script.src = "https://telegram.org/js/telegram-widget.js?22";
                script.setAttribute('data-telegram-login', BOT_USERNAME);
                script.setAttribute('data-size', 'large');
                script.setAttribute('data-onauth', 'onTelegramAuth(user)');
                script.setAttribute('data-request-access', 'write');
                widgetContainer.appendChild(script);
                
            } catch(err) {
                console.error("Ralat:", err.message);
                document.getElementById('init-section').classList.remove('hidden');
                const errorDiv = document.getElementById('error-msg');
                errorDiv.innerText = "Token rosak atau tidak sah. Sila jana token baru dari bot.";
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 5000);
            }
        }
    };
</script>
</body>
</html>
