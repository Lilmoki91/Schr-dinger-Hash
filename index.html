<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Identity Gate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #050914; color: #00ffcc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #0b1120; border: 1px solid #00ffcc; padding: 30px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        h1 { font-size: 20px; margin-bottom: 20px; text-transform: uppercase; }
        .btn { display: block; width: 100%; padding: 12px; background: #00ffcc; color: #050914; font-weight: bold; margin-bottom: 15px; cursor: pointer; border: none; text-decoration: none; border-radius: 5px; }
        .console { background: #000; color: #0f0; padding: 15px; font-size: 12px; text-align: left; height: 200px; overflow-y: auto; border: 1px solid #333; margin-top: 15px; }
        .error { color: #ff3333; margin-top: 10px; font-weight: bold; }
        .success { color: #00ffcc; }
        .hidden { display: none; }
        .telegram-login { min-height: 50px; margin: 20px 0; display: flex; justify-content: center; }
        .warning { color: #ffaa00; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Quantum Identity Gate</h1>
    
    <!-- SECTION 1: Init / Button Utama (sentiasa ada) -->
    <div id="init-section">
        <a href="https://t.me/kipidapps_bot" target="_blank" class="btn">🔐 Jana State Vector (Telegram)</a>
        <p class="warning" style="font-size: 11px; margin-top: 5px;">⚠️ Token tamat selepas 30 saat – 10 minit (bergantung kekerapan akses)</p>
    </div>
    
    <!-- SECTION 2: Login (Ada Token sah, belum login) -->
    <div id="login-section" class="hidden">
        <p>🔐 SAHKAN IDENTITI PEMERHATI</p>
        <div id="telegram-login" class="telegram-login"></div>
        <p id="error-msg" class="error hidden"></p>
        <button id="backToInitBtn" class="btn" style="background: #333; color: #00ffcc; margin-top: 10px;">⬅ Kembali / Jana Token Baru</button>
    </div>
    
    <!-- SECTION 3: Verify (Sudah Login + Sah) -->
    <div id="verify-section" class="hidden">
        <p id="status-text">Menyelaras...</p>
        <div class="console" id="console-log"></div>
    </div>
</div>

<script>
    let state = { token: null, userIdFromToken: null, seedHex: null, remoteHash: null, tokenId: null };
    
    function log(msg, cls = '') {
        const box = document.getElementById('console-log');
        if(!box) return;
        const line = document.createElement('div');
        line.className = cls;
        line.innerText = '> ' + msg;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }
    
    function resetToInit() {
        // Reset state
        state = { token: null, userIdFromToken: null, seedHex: null, remoteHash: null, tokenId: null };
        // Tunjukkan init section, sembunyi yang lain
        document.getElementById('init-section').classList.remove('hidden');
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('verify-section').classList.add('hidden');
        // Bersihkan widget container
        const widgetContainer = document.getElementById('telegram-login');
        widgetContainer.innerHTML = '';
        // Bersihkan error
        const errorMsg = document.getElementById('error-msg');
        errorMsg.classList.add('hidden');
        errorMsg.innerText = '';
        console.log("Kembali ke mod permulaan. Sila jana token baru dari bot.");
    }
    
    async function calculateQuantumHash(userIdStr, seedHex) {
        let bits = new Array(8).fill(0);
        for(let i=0; i<6; i++) bits[i] = parseInt(seedHex.substr(i*2, 2), 16) % 2;
        let uid = BigInt(userIdStr);
        bits[6] = Number(uid % 256n) > 128 ? 1 : 0;
        bits[7] = Number((uid >> 8n) % 256n) > 128 ? 1 : 0;
        for(let i=0; i<6; i++) if(bits[6] === 1) bits[i] ^= 1;
        let finalIndex = (bits[0]<<7) | (bits[1]<<6) | (bits[2]<<5) | (bits[3]<<4) | (bits[4]<<3) | (bits[5]<<2) | (bits[6]<<1) | bits[7];
        
        let stateList = new Array(256).fill(0);
        stateList[finalIndex] = 1;
        let stateStr = JSON.stringify(stateList);
        
        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(stateStr));
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    window.onTelegramAuth = async function(telegramUser) {
        const loggedInUserId = telegramUser.id.toString();
        const errorMsg = document.getElementById('error-msg');
        
        if (!state.userIdFromToken) {
            errorMsg.innerText = "❌ Tiada token. Sila jana token baru dari bot.";
            errorMsg.classList.remove('hidden');
            return;
        }
        
        // Semak token "sekali pakai"
        if (state.tokenId) {
            const usedKey = `used_quantum_token_${state.tokenId}`;
            if (sessionStorage.getItem(usedKey)) {
                errorMsg.innerText = "[403 FORBIDDEN] Token sudah pernah digunakan! Sila jana baru.";
                errorMsg.classList.remove('hidden');
                return;
            }
            sessionStorage.setItem(usedKey, 'true');
        }
        
        if (loggedInUserId !== state.userIdFromToken) {
            errorMsg.innerText = `[403 FORBIDDEN] Identiti tidak sepadan! ID Anda: ${loggedInUserId}`;
            errorMsg.classList.remove('hidden');
            return;
        }
        
        errorMsg.classList.add('hidden');
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('verify-section').classList.remove('hidden');
        document.getElementById('console-log').style.display = 'block';
        
        log(`✅ Identiti disahkan: ${loggedInUserId}`);
        log("Membina litar kuantum...");
        
        const localHash = await calculateQuantumHash(state.userIdFromToken, state.seedHex);
        log(`Bot Hash: ${state.remoteHash.substring(0,16)}...`);
        log(`Local Hash: ${localHash.substring(0,16)}...`);
        
        if (localHash === state.remoteHash) {
            log("PADANAN BERJAYA", "success");
            document.getElementById('status-text').innerText = "Portal Berdaulat Dibuka.";
            setTimeout(() => {
                window.location.href = `kucing-kuantum.html?token=${encodeURIComponent(state.token)}`;
            }, 1500);
        } else {
            log("HASH TIDAK PADAN", "error");
            document.getElementById('status-text').innerText = "Akses Ditolak.";
        }
    };
    
    window.onload = () => {
        const token = new URLSearchParams(window.location.search).get('token');
        
        // Butang kembali
        const backBtn = document.getElementById('backToInitBtn');
        if (backBtn) {
            backBtn.addEventListener('click', resetToInit);
        }
        
        if (token) {
            try {
                const data = JSON.parse(atob(token));
                
                // Semak expiry
                const currentTime = Math.floor(Date.now() / 1000);
                if (data.exp && currentTime > data.exp) {
                    // Token tamat, tunjuk init section dengan mesej
                    document.getElementById('init-section').classList.remove('hidden');
                    const warningMsg = document.createElement('p');
                    warningMsg.className = 'warning';
                    warningMsg.innerText = '⚠️ Token telah tamat tempoh. Sila jana token baru dari bot.';
                    document.getElementById('init-section').appendChild(warningMsg);
                    setTimeout(() => warningMsg.remove(), 5000);
                    return;
                }
                
                state.token = token;
                state.userIdFromToken = data.u;
                state.seedHex = data.s;
                state.remoteHash = data.h;
                state.tokenId = data.tid || null;
                
                // Sembunyi init, tunjuk login section
                document.getElementById('init-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
                
                // Suntik widget Telegram
                const widgetContainer = document.getElementById('telegram-login');
                widgetContainer.innerHTML = '';
                const script = document.createElement('script');
                script.async = true;
                script.src = "https://telegram.org/js/telegram-widget.js?22";
                script.setAttribute('data-telegram-login', 'kipidapps_bot');
                script.setAttribute('data-size', 'large');
                script.setAttribute('data-onauth', 'onTelegramAuth(user)');
                script.setAttribute('data-request-access', 'write');
                widgetContainer.appendChild(script);
                
            } catch(err) {
                console.error("Ralat:", err.message);
                // Token rosak, tunjuk init section
                document.getElementById('init-section').classList.remove('hidden');
                const errorDiv = document.getElementById('error-msg');
                errorDiv.innerText = "Token rosak atau tidak sah. Sila jana token baru dari bot.";
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 5000);
            }
        }
    };
</script>
</body>
</html>
