<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Quantum Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #050914;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #0b1120;
            border: 1px solid #00ffcc;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
        h1 { font-size: 20px; margin-bottom: 20px; text-transform: uppercase; }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #050914;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn:hover { background: #00cca3; }
        .console {
            background: #000;
            color: #0f0;
            padding: 15px;
            font-size: 12px;
            text-align: left;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
            display: none;
        }
        .error { color: #ff3333; }
        .success { color: #00ffcc; }
    </style>
</head>
<body>

<div class="container">
    <h1>Quantum Identity Gate</h1>
    
    <div id="init-section">
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
            Sistem pengesahan berdaulat menggunakan Litar CNOT 8-Qubit.
        </p>
        <a href="https://t.me/kipidaps_bot" target="_blank" class="btn">Pautkan Telegram (Jana Seed)</a>
    </div>

    <div id="verify-section" style="display: none;">
        <p id="status-text" style="margin-bottom: 15px;">Mengesahkan State Vector...</p>
        <div class="console" id="console-log"></div>
    </div>
</div>

<script>
    function getParams() {
        const params = {};
        window.location.search.substring(1).split("&").forEach(pair => {
            if (!pair) return;
            const parts = pair.split("=");
            params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
        });
        return params;
    }

    function logConsole(msg, className = '') {
        const box = document.getElementById('console-log');
        const line = document.createElement('div');
        line.className = className;
        line.innerText = `> ${msg}`;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    // Fungsi Utama Kuantum: 6 Qubit + 2 Statik & SHA-256
    async function calculateQuantumSignature(userIdStr, seedHex) {
        let state = new Uint8Array(8);
        
        // 1. 6 Qubit Rawak
        for (let i = 0; i < 6; i++) {
            state[i] = parseInt(seedHex.substr(i * 2, 2), 16);
        }
        
        // 2. 2 Qubit Statik (Guna BigInt untuk ketepatan ID Telegram)
        let userId = BigInt(userIdStr);
        state[6] = Number(userId % 256n);
        state[7] = Number((userId >> 8n) % 256n);
        
        // 3. CNOT Logic (Entanglement)
        for (let i = 0; i < 6; i++) {
            if (state[6] > 128) {
                state[i] = state[i] ^ state[7];
            }
        }
        
        // 4. SHA-256 Hash Wrapper menggunakan native Web Crypto API
        const hashBuffer = await crypto.subtle.digest('SHA-256', state);
        return Array.from(new Uint8Array(hashBuffer))
            .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.onload = async () => {
        const params = getParams();
        
        if (params.user_id && params.seed_hex && params.quantum_hash) {
            document.getElementById('init-section').style.display = 'none';
            document.getElementById('verify-section').style.display = 'block';
            document.getElementById('console-log').style.display = 'block';
            
            logConsole(`Menerima isyarat dari Node: ${params.user_id}`);
            logConsole("Membina litar tempatan (6 rawak + 2 statik)...");

            // Kira state tempatan berdasarkan parameter
            const localHash = await calculateQuantumSignature(params.user_id, params.seed_hex);
            
            logConsole(`Local Signature: ${localHash.substring(0, 16)}...`);
            logConsole(`Remote Signature: ${params.quantum_hash.substring(0, 16)}...`);

            setTimeout(() => {
                if (localHash === params.quantum_hash) {
                    logConsole("PADANAN BERJAYA. Entanglement diaktifkan.", "success");
                    document.getElementById('status-text').innerText = "Akses Dibenarkan. Mengalihkan...";
                    document.getElementById('status-text').className = "success";
                    
0                    // Alih ke laman destinasi kedaulatan
                    setTimeout(() => {
                        window.location.href = "https://lilmoki91.github.io/Schr-dinger-Hash/kucing-kuantum.html";
                    }, 1500);
                } else {
                    logConsole("RALAT: State Vector tidak sepadan! Percubaan klon dikesan.", "error");
                    document.getElementById('status-text').innerText = "Akses Ditolak!";
                    document.getElementById('status-text').className = "error";
                }
            }, 1000);
        }
    };
</script>

</body>
</html>
