<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Quantum Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', Courier, monospace; background-color: #050914; color: #00ffcc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #0b1120; border: 1px solid #00ffcc; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); }
        h1 { font-size: 20px; margin-bottom: 20px; text-transform: uppercase; }
        .btn { display: inline-block; width: 100%; padding: 12px; background: #00ffcc; color: #050914; font-weight: bold; text-decoration: none; margin-bottom: 15px; cursor: pointer; border: none; }
        .console { background: #000; color: #0f0; padding: 15px; font-size: 12px; text-align: left; height: 200px; overflow-y: auto; border: 1px solid #333; display: none; margin-top: 15px; }
        .error { color: #ff3333; } .success { color: #00ffcc; }
    </style>
</head>
<body>

<div class="container">
    <h1>Quantum Identity Gate</h1>
    
    <div id="init-section">
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Litar Entanglement Cirq 8-Qubit</p>
        <a href="https://t.me/kipidaps_bot" target="_blank" class="btn">Jana State Vector (Telegram)</a>
    </div>

    <div id="verify-section" style="display: none;">
        <p id="status-text">Menyelaras Fungsi Gelombang...</p>
        <div class="console" id="console-log"></div>
    </div>
</div>

<script>
    function logConsole(msg, className = '') {
        const box = document.getElementById('console-log');
        const line = document.createElement('div');
        line.className = className;
        line.innerText = `> ${msg}`;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    async function calculateQuantumSignature(userIdStr, seedHex) {
        // 1. Bina array 256 elemen (meniru format result.final_state_vector Cirq)
        let stateList = new Array(256).fill(0);
        let bits = new Array(8).fill(0);
        
        // 2. Set bits Qubit Rawak (0 hingga 5)
        for(let i=0; i<6; i++) {
            bits[i] = parseInt(seedHex.substr(i*2, 2), 16) % 2;
        }
        
        // 3. Set bits Qubit Statik Anchor (6 dan 7)
        let uid = BigInt(userIdStr);
        bits[6] = (Number(uid % 256n) > 128) ? 1 : 0;
        bits[7] = (Number((uid >> 8n) % 256n) > 128) ? 1 : 0;
        
        // 4. Litar Entanglement CNOT (Control: Qubit 6, Target: Qubit 0-5)
        for(let i=0; i<6; i++) {
            if (bits[6] === 1) {
                bits[i] = bits[i] ^ 1; 
            }
        }
        
        // 5. Penyelarasan Susunan Big-Endian Cirq (MSB di Qubit 0)
        let finalIndex = (bits[0] << 7) | (bits[1] << 6) | (bits[2] << 5) | 
                         (bits[3] << 4) | (bits[4] << 3) | (bits[5] << 2) | 
                         (bits[6] << 1) | bits[7];
                         
        stateList[finalIndex] = 1;
        
        // 6. JSON Canonicalization & SHA-256 (Sama bit-per-bit dengan Python json.dumps)
        let stateStr = JSON.stringify(stateList);
        const dataBuffer = new TextEncoder().encode(stateStr);
        const hashBuffer = await crypto.subtle.digest('SHA-256', dataBuffer);
        
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

        window.onload = async () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        
        if (token) {
            try {
                // Nyahkod Token Base64
                const decodedStr = atob(token);
                const data = JSON.parse(decodedStr);
                
                const userId = data.u;
                const seedHex = data.s;
                const remoteHash = data.h;

                document.getElementById('init-section').style.display = 'none';
                document.getElementById('verify-section').style.display = 'block';
                document.getElementById('console-log').style.display = 'block';
                
                logConsole(`Token Nyahsulit. ID: ${userId}`);
                logConsole("Membina padanan litar Big-Endian Cirq di klien...");

                const localHash = await calculateQuantumSignature(userId, seedHex);
                
                logConsole(`Cirq (Python) Hash: ${remoteHash.substring(0, 16)}...`);
                logConsole(`Local (JS) Hash:    ${localHash.substring(0, 16)}...`);

                setTimeout(async () => {
                    if (localHash === remoteHash) {
                        logConsole("PADANAN STATE VECTOR BERJAYA.", "success");
                        document.getElementById('status-text').innerText = "Portal Berdaulat Dibuka.";
                        document.getElementById('status-text').className = "success";
                        
                        // Bawa TOKEN TERENKRIPSI ke laman arkib
                        setTimeout(() => {
                            window.location.href = `kucing-kuantum.html?token=${token}`;
                        }, 1500);
                        
                    } else {
                        logConsole("RALAT KETAKSELARASAN LITAR!", "error");
                        document.getElementById('status-text').innerText = "Akses Ditolak (Klon).";
                        document.getElementById('status-text').className = "error";
                    }
                }, 1000);
                
            } catch (error) {
                logConsole("RALAT: Token tidak sah atau rosak.", "error");
            }
        }
    };

</script>
</body>
</html>
